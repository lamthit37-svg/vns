# CI của VnS: mỗi push lên main và mỗi pull request dựng đủ sáu preset trên Windows + VS 2026,
# đúng những preset mà máy dev dùng. Cổng kiểm hình thức chạy bên trong build (target check_style),
# clang-tidy và /analyze có preset riêng, cảnh báo nào cũng là lỗi.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: kiểm workflow (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color

  tools-python:
    name: Tools Python (ruff, mypy)
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Mỗi Tools/<Tên>/pyproject.toml là một tool Python (CLAUDE.md mục X.10). .venv luôn được dựng
      # để bắt sớm bản ghim không cài được; ruff và mypy chạy khi tool đã có tệp .py.
      - name: ruff và mypy cho từng tool
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path Tools -Filter pyproject.toml -Recurse -Depth 1 -File)
          foreach ($project in $projects) {
            Push-Location $project.DirectoryName
            $sources = @(Get-ChildItem -Filter *.py -Recurse -File)
            "== $($project.Directory.Name): $($sources.Count) tệp .py"
            python -m venv .venv
            .venv\Scripts\python.exe -m pip install --disable-pip-version-check --quiet --group dev
            if ($LASTEXITCODE -ne 0) { throw "pip lỗi ở $($project.DirectoryName)" }
            if ($sources.Count -gt 0) {
              .venv\Scripts\ruff.exe check .
              if ($LASTEXITCODE -ne 0) { throw 'ruff check đỏ' }
              .venv\Scripts\ruff.exe format --check .
              if ($LASTEXITCODE -ne 0) { throw 'ruff format đỏ' }
              .venv\Scripts\mypy.exe .
              if ($LASTEXITCODE -ne 0) { throw 'mypy đỏ' }
            }
            Pop-Location
          }

  build:
    name: build (${{ matrix.preset }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, rel, asan, ubsan, tidy, analyze]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # VNS_TOOLCHAIN_PROBE dựng thêm scripts/ci/probe, để cổng kiểm, tidy, /analyze và sanitizer có
      # mã thật mà chạy ngay cả khi src/ còn trống.
      - name: Configure và build
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DVNS_TOOLCHAIN_PROBE=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Chạy exe thăm dò toolchain
        shell: pwsh
        run: |
          & "build/${{ matrix.preset }}/bin/vns_probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "vns_probe trả mã $LASTEXITCODE (manifest UTF-8 hoặc runtime hỏng)." }

      # Luật triển khai (CLAUDE.md mục X.10) trên runner: cài bản rel ra thư mục tạm, không đụng
      # Client/, Server/, Tools/ của repo.
      - name: Cài thử kiểu deploy
        if: matrix.preset == 'rel'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          cmake --install build/rel --prefix $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probeDir = Join-Path $stage 'Tools/Probe'
          Get-ChildItem $probeDir | ForEach-Object Name
          if (-not (Test-Path (Join-Path $probeDir 'vcruntime140.dll'))) { throw 'Thiếu DLL runtime MSVC.' }
          if (Get-ChildItem $stage -Recurse -Filter *.pdb) { throw 'Bản triển khai không được có pdb.' }
          $info = (Get-Item (Join-Path $probeDir 'vns_probe.exe')).VersionInfo
          "FileDescription=$($info.FileDescription) ProductVersion=$($info.ProductVersion)"
          if ($info.ProductVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Exe thiếu thông tin phiên bản.' }
          & (Join-Path $probeDir 'vns_probe.exe')
          if ($LASTEXITCODE -ne 0) { throw "vns_probe từ bản triển khai trả mã $LASTEXITCODE" }

      # Kiểm thử chính là danh sách tay docs/KIEM-THU.md; tests/ chỉ có khi một phép thử không làm
      # tay được (CLAUDE.md mục X.7), và khi đó nó chạy ở đây.
      - name: Test tự động
        if: hashFiles('tests/CMakeLists.txt') != '' && contains(fromJSON('["dev","asan","ubsan"]'), matrix.preset)
        shell: pwsh
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --timeout 120 -j 4

      - name: Lưu exe bản rel
        if: matrix.preset == 'rel' && hashFiles('src/*/CMakeLists.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vns-rel-${{ github.sha }}
          path: |
            build/rel/bin/*.exe
            build/rel/bin/*.dll
            build/rel/bin/*.pdb
            !build/rel/bin/vns_probe.*
          if-no-files-found: error
          retention-days: 14
